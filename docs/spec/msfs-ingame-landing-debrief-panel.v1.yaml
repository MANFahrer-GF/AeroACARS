ui_requirements:
  compact_monitor_view:
    purpose: Show that AeroACARS is connected and monitoring telemetry before landing.
    visual_reference: VIS-001
    required_elements:
      - product_name
      - connection_status
      - monitoring_message
      - status_indicator
    example_text:
      title: AeroACARS Flight Review
      subtitle: Ready - monitoring flight telemetry

  approach_monitor_view:
    purpose: Show live landing-relevant telemetry before touchdown.
    visual_reference: VIS-002
    required_elements:
      - aircraft
      - vertical_speed_fpm
      - g_force
      - ias_and_gs
      - pitch
      - bank
      - oat
      - visibility
      - runway_and_wind_line

  compact_score_view:
    purpose: Show post-touchdown landing result without leaving MSFS.
    visual_reference: VIS-003
    required_elements:
      - route
      - runway
      - score
      - score_bar
      - score_band
      - short_summary
      - core_subscores
      - wind_and_environment
      - open_full_debrief_action

  full_debrief_view:
    purpose: Show explainable landing result and next correction.
    required_elements:
      - summary
      - score_breakdown
      - touchdown_forensics
      - runway_context
      - weather_context
      - trend_context_if_available
      - next_session_correction

acceptance_criteria:
  - id: AC-001
    text: An AeroACARS toolbar icon appears in MSFS.
  - id: AC-002
    text: Opening the icon displays an ingame panel.
  - id: AC-003
    text: If AeroACARS is not running, the panel shows a waiting/offline state.
  - id: AC-004
    text: If AeroACARS is running, the panel connects to the local bridge and shows ready/monitoring state.
  - id: AC-004a
    text: >
      No pairing/PIN step exists (round 2). The panel reaches
      ready_monitoring automatically as soon as AeroACARS is running —
      zero pilot action required to connect.
  - id: AC-005
    text: During approach/final, the panel can auto-activate according to settings.
  - id: AC-006
    text: The panel does not open duplicate instances when auto-activation fires multiple times.
  - id: AC-007
    text: During approach/landing, the panel shows live telemetry values from AeroACARS.
  - id: AC-008
    text: After touchdown, AeroACARS emits LandingDebriefV1.
  - id: AC-009
    text: After touchdown, the panel automatically switches to compact score view.
  - id: AC-010
    text: The displayed score matches the AeroACARS authoritative score.
  - id: AC-011
    text: Open Full Debrief opens the expanded debrief view.
  - id: AC-012
    text: Full debrief includes at least one clear next-session correction.
  - id: AC-013
    text: Temporary local bridge disconnects recover without restarting MSFS where possible.

implementation_notes:
  - id: IMPL-001
    text: Prefer keeping all authoritative scoring and coaching logic inside AeroACARS.
  - id: IMPL-002
    text: The MSFS panel should be implemented as HTML/JS/CSS toolbar package.
  - id: IMPL-003
    text: The local bridge should bind only to localhost/LAN by default, unchanged from today's remote-control gate.
  - id: IMPL-004
    text: WebSocket messages should be versioned and tolerate additive fields.
  - id: IMPL-005
    text: Reuse existing AeroACARS landing-scoring and touchdown-forensics data where possible.
  - id: IMPL-006
    text: Do not add full-flight constant 30 Hz logging just for this feature.
  - id: IMPL-007
    text: >
      Extend client/src-tauri/src/remote/ (router.rs, net.rs) with
      panel-specific routes instead of building a new server. Round 2:
      these are unauthenticated + strictly loopback-gated (net.rs::
      is_loopback_peer), NOT auth.rs's token/PIN model — that model stays
      in place unchanged for the tablet's /api + /ws routes, it's just not
      what the panel uses.
  - id: IMPL-008
    text: >
      Do not commit to full MSFS build effort before feasibility_spike
      resolves whether Coherent GT permits an authenticated WebSocket (or
      only fetch, or neither) to the reused local server.

feasibility_spike:
  status: in_progress
  round_1_result: >
    Run 2026-08-08 on Thomas's Windows/MSFS-2024 rig. INCONCLUSIVE on the
    actual goal (network reachability) — blocked before getting there — but
    produced two real, confirmed findings plus four verified packaging
    fixes now merged into msfs-panel/. Full field report:
    aeroacars-msfs-panel-windows-test-ergebnis-20260808-203900.zip
    (Nextcloud Daten-Tausch-Ordner) / see [[aeroacars-msfs-ingame-debrief-panel-spec]]
    in the memory graph for the complete writeup.
  round_1_confirmed_working: >
    Coherent GT renders our custom HTML/CSS panel correctly — title,
    status line, PIN field, button and help text all appeared cleanly in
    the MSFS toolbar once the packaging structure (below) was fixed. This
    was completely unknown before and rules out "Coherent GT can't load
    our assets at all" as a failure mode.
  round_1_new_blocker: >
    Coherent GT toolbar-panel text inputs do not receive keyboard focus by
    default — MSFS's own control bindings intercept keystrokes unless the
    panel explicitly claims/releases focus via
    Coherent.trigger('FOCUS_INPUT_FIELD', ...) /
    ('UNFOCUS_INPUT_FIELD', ...) (documented on MSFS DevSupport, "Disable
    Bound Key Events when input into toolbar apps", confirmed working by a
    PMDG developer in that thread). This blocked PIN entry entirely, so
    round 1 never reached the actual fetch()/WebSocket test. A fix using
    that same Coherent.trigger pattern is now in panel.js, but is NOT YET
    independently re-verified live — the session that added it crashed
    (unrelated CTD, cause not investigated) before confirming it restores
    typing. There is a secondary, unconfirmed suspicion that the panel
    also can't be dragged because it has no title bar of its own (MSFS
    panels apparently must build their own window chrome for that — not
    automatic) — possibly the same root cause as the focus issue, possibly
    not. First thing round 2 should check.
  round_1_packaging_fixes: >
    Four real build-time bugs found and fixed, each verified against a
    working public reference project (github.com/jopeek/msfs-panel-simaware,
    same panel type, full source + build output) — now applied to
    msfs-panel/ on main: (1) AssetPackage needs <PackageOrderHint> or
    validation fails; (2) needs an explicit <Dependencies> block (the
    unused manifest.json had it, the actual AssetPackage XML the Project
    Editor reads did not); (3) needed TWO AssetGroups, not one — a
    Type=SPB group for the panel definition (PackageSources\InGamePanels\
    -> InGamePanels\) and a separate Type=Copy group for html_ui
    (PackageSources\html_ui\ -> html_ui\); the original single-group setup
    nested both under Build\, not package-root, which is why the toolbar
    icon never appeared before this fix. msfs-panel/Build/PackageSources/
    was restructured to InGamePanels/ + html_ui/ subfolders to match.
    (4) MSFS 2024 has no standalone ProjectEditor.exe like 2020 — Project
    Editor only runs in-sim via Developer Mode; msfs-panel/README.md's
    Windows build steps need updating for this (not yet done).
  round_1_open_for_round_2: >
    (a) verify the FOCUS_INPUT_FIELD fix actually restores PIN typing;
    (b) if not, investigate the title-bar/window-chrome theory; (c) once
    PIN entry works, THAT is when the original goal below finally gets
    tested; (d) AssetPackage Version was bumped 0.2.5->0.2.6 on a hunch
    that MSFS caches built packages by version and was serving stale
    content — never actually verified, re-check if the same symptom
    recurs; (e) the CTD's cause is unknown and wasn't investigated
    (session ended by Thomas's choice) — not established as related to
    this panel, but also not ruled out; keep an eye out if it recurs.
    SUPERSEDED by round_2_changes below — (a)/(b) turned out to be the
    wrong question once the PIN requirement itself was removed.
  round_2_changes: >
    Prompted by direct Thomas feedback mid-round-1-writeup ("warum brauchen
    wir eine PIN Abfrage? und warum sieht das Plugin so scheisse aus? ...
    lässt sich nicht mal verschieben"), both raised issues turned out to
    have real, fixable root causes rather than being inherent MSFS/Coherent
    GT limitations:
    (1) PIN removed entirely — replaced by three unauthenticated,
    strictly-loopback-gated routes (/panel/status, /panel/debrief,
    /panel/ws) on the same existing server; see panel_pairing_flow.status
    and local_api. This also sidesteps round 1's keyboard-focus blocker
    completely (no typed input needed at all anymore), so (a)/(b) above
    are moot — round 2 goes straight to testing the actual goal.
    (2) Not draggable/resizable — root cause found (not live-verified
    yet): the panel was missing MSFS's own <ingame-ui panel-id="..."
    title="..." ...> wrapper element, which is what the native frame
    recognizes to supply a title bar/drag/resize — verified against
    github.com/bymaximus/msfs2020-toolbar-window-template, whose reference
    HTML wraps everything in exactly this element with no additional
    custom drag code. Round 1 shipped plain <div class="panel"> content
    with no such wrapper. Added in AeroACARSPanel.html; not yet
    live-verified this alone is sufficient.
    AssetPackage Version bumped 0.2.6->0.2.7 (substantial round-2 changes,
    same caching precaution as round 1's bump, still unverified whether
    that precaution is even necessary).
  goal: >
    Resolve LIM-001 and the local_api.websocket_live.risk_note before
    committing to the full panel build: does a minimal MSFS 2024 in-game
    HTML/JS toolbar panel, registered through the official "publish
    component library" SDK path, reach an already-running instance of
    AeroACARS's existing LAN Remote Control server (127.0.0.1:8765) via
    fetch and/or WebSocket, with and without a valid bearer token?
  independent_corroboration: >
    A second, unrelated MSFS 2024 in-game panel project (an ATC-assist
    panel, github.com/Vihaan2012-cmyk/AI-ATC) documents the identical
    unresolved risk in its own README: it connects its desktop app over
    ws://localhost:8742, confirms the WebSocket works "in a normal
    browser", but flags "CoherentGT may block ws://localhost" as
    explicitly untested and unresolved ("the main unknown and needs
    in-sim testing"), with a standalone desktop-widget fallback for if
    it's blocked. This independently confirms LIM-001 is a live,
    community-wide open question, not a one-off SQWK quirk, and that our
    exit_criteria (including a non-WS fallback) are the right shape.
  steps:
    - "Build a throwaway MSFS 2024 Community package: manifest + panel.xml
      + a single HTML/JS panel registered on the toolbar (no AeroACARS
      logic yet). Note MSFS reads panel.xml only from a compiled .spb
      produced by the SDK's fspackagetool, not raw source files, so the
      spike must go through a real build/package step, not a live-reload
      HTML edit."
    - "From inside that panel (Coherent GT), attempt: (a) fetch GET
      http://127.0.0.1:8765/api/... , (b) new WebSocket to ws://127.0.0.1:8765/ws.
      Record pass/fail and the exact error for each."
    - Use the Coherent GT Debugger (MSFS SDK) to inspect what Origin/Host
      headers the panel's own requests actually carry.
    - If WS is blocked but fetch works, note that as the fallback for
      SHOULD-009 (polling mode).
    - If both are blocked outright, check whether the official "publish
      component library for 2024 in-game panels" SDK path (a declared,
      signed manifest) changes the sandbox's network permissions, since
      that thread exists specifically about this class of problem.
    - Confirm whether an Origin header is sent at all, and if so whether
      it is a coui:// value that would trip
      remote/router.rs::reject_foreign_origin; if so, scope a narrow
      allowlist change there rather than weakening the check generally.
  exit_criteria:
    - >
      GO: fetch and/or WebSocket reach the existing remote server
      end-to-end (paired + unpaired) with clear, reproducible steps ->
      proceed to build panel_pairing_flow + panel UI against this spec.
    - >
      CONDITIONAL GO: only fetch works, not WebSocket -> proceed, but
      panel_modes/local_api switch to polling per SHOULD-009 and
      websocket_live becomes optional/future.
    - >
      NO-GO: neither reaches the server even after the signed-manifest
      path and Origin allowlist adjustments -> this spec's MSFS panel is
      not viable as an extension of AeroACARS's own local server; would
      need a fundamentally different bridge (e.g. a WASM/SimConnect
      Client Data Area channel instead of HTTP) or the feature is shelved.
  sources:
    - https://devsupport.flightsimulator.com/t/ui-modifications-for-msfs-2024/10099
    - https://devsupport.flightsimulator.com/t/publish-component-library-for-2024-in-game-panels/11541
    - https://docs.flightsimulator.com/msfs2024/html/6_Programming_APIs/JavaScript/Coherent_GT_Debugger.htm
