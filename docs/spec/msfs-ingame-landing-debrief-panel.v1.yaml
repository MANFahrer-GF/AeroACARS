schema_version: 1
spec_id: aeroacars.msfs_ingame_landing_debrief_panel.v1
title: AeroACARS MSFS Ingame Landing Debrief Panel
status: draft
target_product: AeroACARS
target_platforms:
  - msfs_2024
platform_scope_note: >
  msfs_2020 is explicitly out of scope for the in-sim toolbar panel. MSFS
  2020 pilots keep full parity through the existing AeroACARS desktop app
  and landing debrief UI (no toolbar overlay). This mirrors the reference
  product SQWK Flight Review, whose own guide states the in-sim panel
  "currently requires MSFS 2024" and that 2020 users get the desktop/web
  flow only. Revisit only if MSFS SDK evidence emerges that 2020's older
  Coherent GT/toolbar API actually supports this.
primary_goal: >
  Provide an AeroACARS in-simulator MSFS 2024 toolbar panel that automatically
  activates before landing, displays live landing telemetry, and switches to a
  compact landing score plus full structured debrief after touchdown.

source_context:
  compared_against:
    - SQWK Flight Review style in-sim score panel
  aeroacars_reference_version:
    tag: v1.4.7
    remote: origin/main
  important_existing_aeroacars_capabilities:
    - landing_forensics_v2
    - high_rate_touchdown_buffer
    - landing_scoring_crate
    - runway_context
    - weather_metar_context
    - frontend_coach_tips
    - landing_trend_ui
    - lan_remote_control_server
  known_limitations:
    - id: LIM-001
      text: >
        Coherent GT (the MSFS in-game UI engine hosting toolbar panels) is
        documented by the MSFS dev-support community to block or restrict
        ws://localhost by default. A bare, always-open WebSocket per the
        original MUST-003 draft is unlikely to work unmodified; see
        panel_pairing_flow and IMPL-007.
      source: https://devsupport.flightsimulator.com/t/ui-modifications-for-msfs-2024/10099
    - id: LIM-002
      text: >
        SQWK Flight Review's in-sim panel is MSFS 2024-only; its own guide
        gives no MSFS 2020 path for the panel itself, only for the desktop
        exporter/website flow.
      source: https://sqwk.io/guide

visual_references:
  - id: VIS-001
    name: Compact monitoring status bar
    file: docs/spec/assets/msfs-panel-compact-monitor-reference.png
    applies_to:
      - compact_monitor_view
      - ready_monitoring
      - approach_auto_activation
    intent: >
      Use as visual reference for the small pre-landing auto-activated status
      panel. It should communicate that AeroACARS is ready and monitoring
      telemetry without covering much of the simulator view.
    required_visual_traits:
      - small_horizontal_panel
      - dark_translucent_background
      - app_icon_left
      - product_name
      - ready_monitoring_subtitle
      - green_connected_status_indicator

  - id: VIS-002
    name: Live telemetry card
    file: docs/spec/assets/msfs-panel-live-telemetry-reference.png
    applies_to:
      - approach_monitor_view
      - live_telemetry
    intent: >
      Use as visual reference for the approach/landing monitoring card. It
      should show live flight telemetry in a compact stacked metric layout.
    required_visual_traits:
      - compact_vertical_card
      - dark_translucent_background
      - route_or_aircraft_header
      - live_streaming_status
      - two_column_metric_rows
      - strong_monospace_numeric_values
      - runway_wind_footer_line

  - id: VIS-003
    name: Landing score card
    file: docs/spec/assets/msfs-panel-landing-score-reference.png
    applies_to:
      - compact_score_view
      - landing_score
      - post_touchdown_debrief_entry
    intent: >
      Use as visual reference for the post-touchdown score card. It should show
      route, runway, total score, score band, score bar, core landing metrics,
      environment values, and an action to open the full debrief.
    required_visual_traits:
      - centered_compact_score_card
      - dark_translucent_background
      - route_header
      - runway_distance_elapsed_subheader
      - large_total_score
      - horizontal_score_bar
      - score_band_badge
      - compact_metric_list
      - colored_metric_status_dots
      - open_full_debrief_footer

architecture:
  status: >
    SUPERSEDES the original component/data_flow design below with what is
    actually implemented (client/src-tauri, commit pending on main, all
    tests green incl. remote::bridge::tests::
    every_generated_command_is_either_bridged_or_explicitly_denied).
    Building the real thing surfaced a much simpler shape than first
    drafted — see rationale in each subsection. The MSFS-side panel
    package itself (html_ui/) is separately tracked in
    feasibility_spike, since that part still needs a live MSFS test.
  components:
    - id: aeroacars_app
      name: AeroACARS desktop app
      responsibility:
        - collect simulator telemetry
        - detect flight phase
        - compute landing forensics
        - compute landing score and sub-scores
        - expose local panel API
    - id: local_panel_bridge
      name: Localhost HTTP and WebSocket bridge
      reuses: aeroacars_lan_remote_control_server
      note: >
        IMPLEMENTED as zero new routes. No PanelStateV1/LiveTelemetryV1/
        PanelAutoActivateV1/LandingDebriefV1 wire types were built —
        turned out unnecessary. The panel is a thin consumer of two
        already-existing, already-bridged surfaces on the existing axum
        server (client/src-tauri/src/remote/): the 1Hz flight_status WS
        push (now carrying a new optional `live` telemetry sub-object,
        PanelLiveSnapshot in lib.rs) and the already-bridged
        `POST /api/cmd/landing_get_current` HTTP endpoint. See local_api.
      responsibility:
        - expose current panel state (via existing flight_status)
        - stream live telemetry (via existing flight_status.live)
        - expose landing debrief data (via existing landing_get_current)
    - id: msfs_ingame_panel
      name: MSFS toolbar ingame panel
      responsibility:
        - appear as MSFS toolbar panel
        - render status, monitoring, score, and debrief views
        - connect to the loopback-only /panel/* routes on load, no
          pairing/handshake step (see panel_pairing_flow.status — removed
          in round 2)
        - derive panel_modes client-side from flight_status fields
          (phase, landing_score_finalized, live) — no server-side mode
          state machine was built; the panel computes its own mode
        - reconnect to AeroACARS local bridge
        - never recompute landing score

  data_flow:
    - from: aeroacars_app
      to: msfs_ingame_panel
      protocol: http_websocket_localhost (existing LAN remote-control server, /panel/* routes)
      note: >
        GET /panel/ws pushes the existing flight_status event every 1s
        (unchanged cadence/dedup logic), now including
        live: PanelLiveSnapshot { vertical_speed_fpm, g_force, ias_kt,
        gs_kt, pitch_deg, bank_deg, wind_dir_deg, wind_speed_kt, oat_c }
        whenever a sim snapshot is available (None on sim disconnect).
        Once landing_score_finalized flips true on this SAME event, the
        panel does one GET /panel/debrief to fetch the full LandingRecord
        for the score/debrief views. No push event carries the debrief
        payload itself — it's pulled once, on the finalize edge. No
        token/header needed on either call — see local_api.
      payloads:
        - flight_status (ActiveFlightInfo, existing shape + new `live` field)
        - panel/debrief response (LandingRecord, existing shape)

panel_pairing_flow:
  status: >
    REMOVED entirely in round 2 (2026-08-08), not just simplified. Thomas's
    round-2 feedback ("warum brauchen wir eine PIN Abfrage?") was correct:
    a typed PIN made sense for the tablet remote-control use case (a
    genuinely different device that has to prove authorization) but was a
    threat-model mismatch for this panel, which only ever runs on the SAME
    PC as AeroACARS — there is no cross-device trust question to solve.
    Round 1's actual keyboard-focus blocker (Coherent GT toolbar text
    inputs don't get focus by default) only existed because the panel
    needed the pilot to type something at all; removing the PIN removes
    that entire bug class along with the friction. See local_api below for
    what replaced it.
  superseded_by: >
    Three new unauthenticated, loopback-only routes on the SAME existing
    LAN Remote Control server (client/src-tauri/src/remote/router.rs,
    v0.1.1 #msfs-panel): GET /panel/status, GET /panel/debrief,
    GET /panel/ws. Security boundary moved from "bearer token, LAN-wide
    reachable" to "no token, loopback-only reachable" — narrower in reach
    (only this PC, not the whole LAN) even though it dropped the token,
    because loopback-only is the entire point: only a process on this same
    machine can ever open that socket. See router.rs's module doc for the
    full reasoning, and net.rs::is_loopback_peer (stricter than the
    existing is_private_peer the tablet API uses).

local_api:
  status: >
    IMPLEMENTED — client/src-tauri, commit pending on main, 48 remote::
    tests green (2 new: loopback_accepts_only_loopback_not_wider_lan,
    panel_routes_reject_lan_peers_that_full_remote_routes_would_allow).
    The token-gated /api + /ws block further below is UNCHANGED and still
    exists for the tablet; /panel/* is new and separate, not a relaxation
    of it.
  host: 127.0.0.1
  default_port: 8765
  port_note: >
    Same server, same default/configurable port as the existing LAN
    Remote Control server (remote_server.json / remote_server_set_port) —
    /panel/* are additional routes on it, not a second server.
  panel_endpoints:
    - id: panel_status
      method: GET
      path: /panel/status
      auth_required: false
      loopback_only: true
      response_schema: ActiveFlightInfo (existing flight_status shape, + `live`)
      purpose: Poll fallback (SHOULD-009) if /panel/ws doesn't work.
    - id: panel_debrief
      method: GET
      path: /panel/debrief
      auth_required: false
      loopback_only: true
      response_schema: LandingRecord (storage crate, existing shape)
      purpose: >
        Pulled ONCE per landing by the panel, only after
        landing_score_finalized (MUST-012a) — never on raw touchdown.
    - id: panel_websocket
      method: WEBSOCKET
      path: /panel/ws
      auth_required: false
      loopback_only: true
      messages:
        - flight_status (existing event name/shape, + new `live` field)
      purpose: >
        Existing 1Hz push (unchanged cadence/dedup), now also fanned out
        on this unauthenticated route. The panel derives every
        panel_mode transition from this stream plus the one pull above.
      note: >
        Deliberately skips the foreign-Origin check the token-gated /ws
        has: a file://-loaded panel sends `Origin: null` (present, not
        absent), which that check would treat as foreign and reject.
        There's no token here to protect against a cross-site replay of,
        so the loopback gate alone is the real protection for this route.
  tablet_endpoints_unchanged:
    - id: pairing
      method: POST
      path: /api/auth
      body: "{pin}"
      response: "{token}"
      purpose: >
        Still exists, still used by the tablet remote-control UI — NOT
        used by the panel anymore as of round 2.
    - id: landing_debrief_pull_authenticated
      method: POST
      path: /api/cmd/landing_get_current
      auth_required: true
      purpose: Same underlying data as panel_debrief, tablet-facing path.
    - id: websocket_live_authenticated
      method: WEBSOCKET
      path: /ws
      auth_required: true
      purpose: Same underlying stream as panel_websocket, tablet-facing path.

panel_modes:
  - id: disconnected
    description: AeroACARS local bridge is not reachable.
  - id: ready_monitoring
    description: AeroACARS is connected and monitoring flight telemetry.
  - id: flight_active
    description: Flight is active but not in approach or landing focus mode.
  - id: approach_monitor
    description: Panel is visible before landing and shows live approach telemetry.
  - id: scoring
    description: >
      Touchdown has happened (phase left approach/final) but
      `flight_status.landing_score_finalized` is still false. The
      post-touchdown vertical-speed refinement takes roughly 9-12 seconds
      (touchdown-forensics v2); the raw SimVar-latched value observed at
      the moment of touchdown is known to be wrong by a material margin
      (field precedent: -770 fpm raw vs. -455 fpm refined, same landing,
      31.07.2026 report, which is exactly why the existing hard-landing
      banner was fixed to gate on this same flag). The panel MUST show
      this transitional state ("scoring your landing...") rather than
      either freezing on the last approach_monitor frame or fetching/
      showing landing_get_current before the flag flips. See MUST-012a.
  - id: landing_score
    description: >
      Compact post-touchdown score card is visible. Only entered once
      landing_score_finalized is true (never on raw touchdown).
  - id: full_debrief
    description: Expanded landing debrief is visible.

functional_requirements:
  must:
    - id: MUST-001
      text: The feature must provide an MSFS toolbar/ingame panel package.
    - id: MUST-002
      text: The panel must be usable without alt-tabbing out of MSFS.
    - id: MUST-003
      text: >
        The panel must communicate with AeroACARS via local HTTP and
        WebSocket, via routes gated to STRICT loopback on the server side
        (net::is_loopback_peer) — not the wider private-LAN range the
        tablet API uses. This is the panel's entire security boundary
        (round 2: no PIN/token — see MUST-003a and platform_scope_note's
        sibling, panel_pairing_flow.status, for why that's the right
        trade for a same-PC-only consumer).
    - id: MUST-003a
      text: >
        The panel must NOT require any typed input or pairing step to
        connect — it should reach ready_monitoring automatically once
        AeroACARS is running, with zero pilot action. (Superseded MUST-003a:
        round 1's "offer an explicit Authenticate action" — dropped along
        with the PIN it was authenticating.)
    - id: MUST-003b
      text: >
        The in-sim panel targets MSFS 2024 only. MSFS 2020 is out of scope
        for this feature end-to-end (see platform_scope_note); do not gate
        MSFS 2020 build/release on this feature.
    - id: MUST-004
      text: AeroACARS must provide score and debrief data; the panel must not recompute landing scores.
    - id: MUST-005
      text: The panel must detect whether AeroACARS is connected.
    - id: MUST-006
      text: The panel must show an offline/waiting state when AeroACARS is not reachable.
    - id: MUST-007
      text: The panel must support automatic activation before landing.
    - id: MUST-008
      text: Automatic activation must be triggered by at least one configured approach condition.
      accepted_conditions:
        - flight_phase_is_approach
        - flight_phase_is_final
        - agl_below_threshold_ft
        - distance_to_destination_below_threshold_nm
    - id: MUST-009
      text: Automatic activation must be user-disableable in AeroACARS settings.
    - id: MUST-010
      text: Automatic activation must not open duplicate panel instances.
    - id: MUST-011
      text: During approach and landing, the panel must display live telemetry.
      telemetry_fields:
        - aircraft
        - route
        - phase
        - vertical_speed_fpm
        - g_force
        - ias_kt
        - gs_kt
        - pitch_deg
        - bank_deg
        - wind
        - oat_c
        - visibility
    - id: MUST-012
      text: >
        After touchdown, the panel must automatically switch to landing
        score mode ONLY once flight_status.landing_score_finalized is
        true, not on raw touchdown/phase change. See MUST-012a.
    - id: MUST-012a
      text: >
        Between touchdown and landing_score_finalized flipping true
        (typically ~9-12s, per the existing touchdown-forensics v2
        refinement window), the panel must show the scoring transitional
        state (panel_modes.scoring) and must not fetch or display
        landing_get_current yet — its numbers are provisional/wrong
        during this window by design (the raw SimVar-latched estimate,
        not the refined one). This mirrors the exact fix already applied
        to AeroACARS's own hard-landing banner for the identical reason.
    - id: MUST-013
      text: Landing score mode must show the core landing result.
      fields:
        - total_score
        - score_band
        - landing_rate_fpm
        - touchdown_g_force
        - bounce_count
        - touchdown_distance
        - runway_used_or_rollout
        - centerline_deviation_if_available
        - approach_stability
    - id: MUST-014
      text: The panel must provide an Open Full Debrief action.
    - id: MUST-015
      text: Full debrief must show at least one clear next-session correction.

  should:
    - id: SHOULD-001
      text: The panel should use a compact dark translucent visual style.
    - id: SHOULD-002
      text: The panel should be suitable for VR usage.
    - id: SHOULD-003
      text: The panel should be movable and resizable using normal MSFS panel behavior.
    - id: SHOULD-004
      text: The panel should automatically reconnect after temporary local bridge disconnects.
    - id: SHOULD-005
      text: The auto-open trigger should be configurable.
      options:
        - disabled
        - approach_phase
        - final_phase
        - agl_below_2000_ft
        - agl_below_1000_ft
        - distance_to_destination_below_15_nm
    - id: SHOULD-006
      text: Before touchdown, the panel should start as a compact monitoring status bar.
    - id: SHOULD-007
      text: After touchdown, the panel should expand to a landing score card.
    - id: SHOULD-008
      text: The debrief should include runway, weather, and trend context when available.
    - id: SHOULD-009
      text: >
        The panel should degrade gracefully to a polling-only mode (GET
        get_panel_state on an interval) if feasibility_spike shows
        Coherent GT permits fetch but not WebSocket, rather than the
        feature being all-or-nothing on WS support.

non_goals:
  - id: NONGOAL-001
    text: The MSFS panel must not contain the authoritative landing scoring algorithm.
  - id: NONGOAL-002
    text: The feature does not require full-flight constant 30 Hz storage.
  - id: NONGOAL-003
    text: The feature does not replace the existing AeroACARS desktop UI.
  - id: NONGOAL-004
    text: The first implementation does not need aircraft-specific WASM/L-var integration.
  - id: NONGOAL-005
    text: >
      MSFS 2020 in-sim panel support is not a goal of this spec (see
      platform_scope_note); MSFS 2020 keeps the existing desktop-only flow.
  - id: NONGOAL-006
    text: >
      This feature does not build a second, parallel local server; it
      extends the existing LAN Remote Control axum server instead
      (local_panel_bridge.reuses).

settings:
  - key: msfs_panel.enabled
    type: boolean
    default: true
    description: Enables the AeroACARS MSFS ingame panel integration.
  - key: msfs_panel.auto_open.enabled
    type: boolean
    default: true
    description: Allows the panel to auto-activate before landing.
  - key: msfs_panel.auto_open.trigger
    type: enum
    default: final_phase
    values:
      - approach_phase
      - final_phase
      - agl_below_2000_ft
      - agl_below_1000_ft
      - distance_to_destination_below_15_nm
    description: Selects the preferred auto-open trigger.
  - key: msfs_panel.local_port
    type: integer
    default: null
    description: >
      Optional override for the panel bridge port; null means "inherit the
      LAN Remote Control server's configured port" (default 8765), since
      the panel reuses that server rather than a dedicated one.

schemas:
  status: >
    NOT wire types anymore (see architecture.status / local_api.status) —
    the actual wire types are the pre-existing flight_status
    (ActiveFlightInfo, now +`live`) and landing_get_current
    (LandingRecord) shapes in lib.rs, unchanged by this feature. The
    schemas below describe the shape the panel's own JS derives/holds in
    memory FROM those two existing responses — kept here as the
    UI-requirements' data dictionary, not as things AeroACARS serializes.
  PanelStateV1:
    type: object
    required:
      - type
      - version
      - connected
      - mode
    properties:
      type:
        const: panel_state
      version:
        const: 1
      connected:
        type: boolean
      mode:
        enum:
          - disconnected
          - ready_monitoring
          - flight_active
          - approach_monitor
          - landing_score
          - full_debrief
      message:
        type: string
      flight:
        ref: FlightSummaryV1
      latest_telemetry:
        ref: LiveTelemetryV1
      latest_debrief:
        ref: LandingDebriefV1

  LiveTelemetryV1:
    type: object
    required:
      - type
      - version
      - timestamp_utc
    properties:
      type:
        const: live_telemetry
      version:
        const: 1
      timestamp_utc:
        type: string
        format: date-time
      aircraft:
        type: string
      route:
        type: string
      phase:
        type: string
      vertical_speed_fpm:
        type: number
      g_force:
        type: number
      ias_kt:
        type: number
      gs_kt:
        type: number
      pitch_deg:
        type: number
      bank_deg:
        type: number
      oat_c:
        type: number
      visibility:
        type: string
      wind:
        ref: WindV1
      runway:
        ref: RunwaySummaryV1

  PanelAutoActivateV1:
    type: object
    required:
      - type
      - version
      - reason
      - mode
    properties:
      type:
        const: panel_auto_activate
      version:
        const: 1
      reason:
        enum:
          - approach_phase
          - final_phase
          - agl_threshold
          - destination_distance_threshold
      phase:
        type: string
      agl_ft:
        type: number
      distance_to_destination_nm:
        type: number
      mode:
        const: approach_monitor

  LandingDebriefV1:
    type: object
    required:
      - type
      - version
      - flight
      - score
      - touchdown
      - coach
    properties:
      type:
        const: landing_debrief
      version:
        const: 1
      generated_at_utc:
        type: string
        format: date-time
      flight:
        ref: FlightSummaryV1
      score:
        ref: LandingScoreSummaryV1
      touchdown:
        ref: TouchdownSummaryV1
      runway_context:
        ref: RunwayContextV1
      weather_context:
        ref: WeatherContextV1
      trend_context:
        ref: TrendContextV1
      score_breakdown:
        type: array
        items:
          ref: SubScoreV1
      coach:
        ref: CoachSummaryV1

  FlightSummaryV1:
    type: object
    properties:
      aircraft:
        type: string
      route:
        type: string
      departure_icao:
        type: string
      arrival_icao:
        type: string
      runway:
        type: string
      distance_nm:
        type: number
      elapsed_time:
        type: string

  LandingScoreSummaryV1:
    type: object
    required:
      - total
      - band
    properties:
      total:
        type: integer
        minimum: 0
        maximum: 100
      band:
        type: string
        examples:
          - GOOD
          - GREAT
          - HARD
          - ROUGH
      context_points:
        type: number
      context_label:
        type: string

  TouchdownSummaryV1:
    type: object
    properties:
      landing_rate_fpm:
        type: number
      g_force:
        type: number
      bounce_count:
        type: integer
      ias_kt:
        type: number
      gs_kt:
        type: number
      pitch_deg:
        type: number
      bank_deg:
        type: number

  RunwayContextV1:
    type: object
    properties:
      airport_icao:
        type: string
      runway_ident:
        type: string
      lda_m:
        type: number
      touchdown_distance_ft:
        type: number
      touchdown_distance_m:
        type: number
      centerline_deviation_ft:
        type: number
      runway_used_percent:
        type: number
      rollout_distance_m:
        type: number

  WeatherContextV1:
    type: object
    properties:
      wind_dir_deg:
        type: number
      wind_speed_kt:
        type: number
      headwind_kt:
        type: number
      crosswind_kt:
        type: number
      oat_c:
        type: number
      visibility:
        type: string
      metar:
        type: string

  TrendContextV1:
    type: object
    properties:
      last_5_avg_score:
        type: number
      direction:
        enum:
          - improving
          - stable
          - declining
          - unknown
      recurring_issue:
        type: string

  SubScoreV1:
    type: object
    properties:
      key:
        type: string
      label:
        type: string
      score:
        type: integer
        minimum: 0
        maximum: 100
      value:
        type: string
      band:
        type: string
      skipped:
        type: boolean
      rationale:
        type: string

  CoachSummaryV1:
    type: object
    required:
      - primary_issue
      - next_correction
    properties:
      primary_issue:
        type: string
      next_correction:
        type: string
      details:
        type: string

  WindV1:
    type: object
    properties:
      direction_deg:
        type: number
      speed_kt:
        type: number
      headwind_kt:
        type: number
      crosswind_kt:
        type: number

  RunwaySummaryV1:
    type: object
    properties:
      airport_icao:
        type: string
      runway_ident:
        type: string

example_messages:
  panel_auto_activate:
    type: panel_auto_activate
    version: 1
    reason: final_phase
    phase: Final
    agl_ft: 1420
    distance_to_destination_nm: 8.4
    mode: approach_monitor

  landing_debrief:
    type: landing_debrief
    version: 1
    generated_at_utc: "2026-08-08T18:30:00Z"
    flight:
      aircraft: B737 MAX 8
      route: KSFO-KBOS
      departure_icao: KSFO
      arrival_icao: KBOS
