[package]
name = "aeroacars-schalterpruefung"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Thomas Kant <github@MANFahrer-GF>", "AeroACARS contributors"]
publish = false
description = "Geführte Schalterprüfung: welche MSFS-LVar gehört zu welchem Cockpitschalter (liest nur, schreibt nichts in den Simulator)."
build = "build.rs"

# Bewusst EIGENSTÄNDIG und nicht Mitglied des Client-Workspaces
# (client/src-tauri/Cargo.toml):
#  - Das Werkzeug ist eine einzelne Konsolen-Exe für Piloten, kein Teil der
#    Tauri-App. Als Workspace-Mitglied liefe es bei jedem `cargo test
#    --workspace` der Client-CI mit und würde deren Lockfile verändern.
#  - `sim-msfs` lässt sich nicht als Pfad-Abhängigkeit wiederverwenden: Seine
#    bindgen-Positivliste (build.rs) enthält weder `SimConnect_SetClientData`
#    noch `SimConnect_CreateClientData`, die der MobiFlight-Befehlskanal braucht,
#    und das Crate zieht sim-core/tokio/tracing nach. Den Client-Code zu ändern
#    ist für dieses Werkzeug ausgeschlossen.
#  - Wiederverwendet wird deshalb nur das vendorte SimConnect-SDK
#    (client/src-tauri/crates/sim-msfs/ffi/…) — gleicher Header, gleiche Lib,
#    gleiches bindgen-Muster, eigene kurze Positivliste (siehe build.rs).
[workspace]

[[bin]]
name = "AeroACARS-Schalterpruefung"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Ctrl+C UND Schließen des Konsolenfensters (CTRL_CLOSE_EVENT) sauber abfangen,
# damit das bisher Gemessene noch geschrieben wird.
ctrlc = { version = "3", features = ["termination"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
bindgen = "0.69"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
