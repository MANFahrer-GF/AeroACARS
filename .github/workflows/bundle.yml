# AeroACARS 3.0 — Laufzeit-Paket bauen, signieren, veröffentlichen
# (Pflichtenheft P-3.10 bis P-3.14, P-9.41 bis P-9.43).
#
# Ablauf: Änderung unter bundle/ -> bauen + testen -> signieren (nur mit
# Secret BUNDLE_MINISIGN_KEY) -> auf live als Vorabstand ablegen (nur
# Vorab-Piloten, P-3.13; Secret LIVE_BUNDLE_VORAB_SSH_KEY) -> Freigabe durch
# Thomas im Environment bundle-produktion -> Zeiger fuer alle umschalten
# (Secret LIVE_BUNDLE_FREIGABE_SSH_KEY nur im Environment). Auf live beschraenkt
# scripts/bundle/ssh-befehl.sh jeden Schluessel auf seine Stufe.
# Ausnahme P-9.43: Laeufe vom OurAirports-Wochenlauf, die sich vom
# veroeffentlichten Stand nur in ourairports/ unterscheiden, gehen ueber das
# Environment bundle-ourairports (ohne Pflicht-Pruefer).
# Fehlen die Secrets, endet der Lauf nach Bauen und Testen; nichts wird
# veröffentlicht. Der private Paketschlüssel existiert nur als Secret.

name: Laufzeit-Paket

on:
  push:
    branches: [v3, main]
    # v3 (Etappe 5): Die Oberflaeche (ui/) ist Paketinhalt — Frontend-Aenderungen
    # bauen ein neues Paket.
    paths:
      - 'bundle/**'
      - 'client/src-tauri/crates/runtime-bundle/**'
      - '.github/workflows/bundle.yml'
      - 'client/src/**'
      - 'client/index.html'
      - 'client/package.json'
      - 'client/package-lock.json'
      - 'client/vite.config.ts'
      - 'client/src-tauri/befehle.json'
      - 'msfs-panel/Build/PackageSources/html_ui/InGamePanels/AeroACARSPanel/panel.*'
  workflow_dispatch:
    inputs:
      nur_ourairports:
        description: 'Vom OurAirports-Wochenlauf: ohne Einzelfreigabe, falls nur ourairports/ abweicht (P-9.43)'
        type: boolean
        default: false

concurrency:
  group: laufzeit-paket
  cancel-in-progress: false

permissions:
  contents: read

# Faehigkeiten, die jedes Paket verlangt (P-2.15) — eine Stelle fuer alle
# Bau-Laeufer; laufzeit_paket.rs prueft sie gegen das Programm.
env:
  REQUIRES: ourairports-1,grenzwerte-2,xplane-profile-1,cpdlc-1,flotte-1,texte-1,spurweiten-1,vref-1,hoehengruppen-1,klappen-1,kabine-1,endpunkte-1,msfs-profile-1,bewertung-1,kabine-modul-1,ui-befehle-2

jobs:
  bauen:
    name: Bauen, testen, signieren
    runs-on: ubuntu-latest
    outputs:
      generation: ${{ steps.gen.outputs.generation }}
      erstellt: ${{ steps.gen.outputs.erstellt }}
      signiert: ${{ steps.signieren.outputs.signiert }}
      umgebung: ${{ steps.umgebung.outputs.umgebung }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - name: runtime-bundle testen
        working-directory: client/src-tauri
        run: cargo test -p runtime-bundle
      - name: Selbsttest-Korpus über das Bewertungsmodul (P-13.02)
        working-directory: client/src-tauri
        run: cargo test -p bewertung-host --test selbsttest_korpus
      # v3 (Etappe 5, P-8.20): Oberflaeche bauen und als ui/ in die Generation
      # legen — Hauptfenster, Telemetrie, LAN-Webapp und HUD laden daraus.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Oberflaeche bauen (ui/)
        working-directory: client
        run: |
          npm ci
          npm run build
          rm -rf "$GITHUB_WORKSPACE/bundle/ui"
          cp -R dist "$GITHUB_WORKSPACE/bundle/ui"
          test -f "$GITHUB_WORKSPACE/bundle/ui/index.html"
          test -f "$GITHUB_WORKSPACE/bundle/ui/hud/panel.js"
          test -f "$GITHUB_WORKSPACE/bundle/ui/flugkarte/index.html"
      - name: Generation festlegen
        id: gen
        # Steigt mit jedem Lauf dieses Workflows; 0 ist der eingebaute Stand.
        # P-3.03: derselbe Zeitstempel auch fuer die Vergleichsbauten.
        run: |
          echo "generation=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "erstellt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Paket bauen
        working-directory: client/src-tauri
        # P-9.44: OurAirports-Commit des Stands (schreibt der Wochenlauf) als
        # Herkunft ins Manifest; unbekannt (vor dem ersten Wochenlauf) -> leer.
        run: |
          OA=()
          if [ -s "$GITHUB_WORKSPACE/scripts/ourairports/stand.txt" ]; then
            OA=(--ourairports-commit "$(head -1 "$GITHUB_WORKSPACE/scripts/ourairports/stand.txt")")
          fi
          cargo run -q -p runtime-bundle --bin paket-bauen -- \
            "$GITHUB_WORKSPACE/bundle" "$GITHUB_WORKSPACE/paket" \
            --generation "${{ steps.gen.outputs.generation }}" \
            --erstellt "${{ steps.gen.outputs.erstellt }}" \
            --repo-commit "${{ github.sha }}" ${OA[@]+"${OA[@]}"} \
            --requires "$REQUIRES"
      - name: Signieren
        id: signieren
        env:
          SCHLUESSEL: ${{ secrets.BUNDLE_MINISIGN_KEY }}
        run: |
          if [ -z "$SCHLUESSEL" ]; then
            echo "Kein BUNDLE_MINISIGN_KEY — Paket bleibt unsigniert, wird nicht veröffentlicht."
            echo "signiert=nein" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get install -y -qq minisign
          umask 077
          # Schluessel ohne Passwort (minisign -G -W), sonst wartet -S auf Eingabe.
          printf '%s\n' "$SCHLUESSEL" > "$RUNNER_TEMP/paket.key"
          minisign -S -s "$RUNNER_TEMP/paket.key" -m paket/manifest.json -t "AeroACARS Laufzeit-Paket g${{ steps.gen.outputs.generation }}" < /dev/null
          rm -f "$RUNNER_TEMP/paket.key"
          echo "signiert=ja" >> "$GITHUB_OUTPUT"
      - name: Freigabeweg waehlen (P-3.12, P-9.43)
        id: umgebung
        env:
          NUR_OA: ${{ inputs.nur_ourairports }}
        # Ohne Einzelfreigabe nur, wenn der Lauf vom Wochenlauf kommt UND sich
        # das Paket vom veroeffentlichten Stand auf live ausschliesslich in
        # ourairports/ unterscheidet. Sonst immer Freigabe durch Thomas.
        run: |
          UMGEBUNG=bundle-produktion
          if [ "$NUR_OA" = "true" ] && python3 -I scripts/bundle/freigabeweg.py paket/manifest.json https://live.kant.ovh; then
            UMGEBUNG=bundle-ourairports
          fi
          echo "umgebung=$UMGEBUNG" >> "$GITHUB_OUTPUT"
          echo "Freigabeweg: $UMGEBUNG"
      - uses: actions/upload-artifact@v4
        with:
          name: laufzeit-paket-g${{ steps.gen.outputs.generation }}
          path: paket/
          retention-days: 30

  # P-3.03 / P-12.03 (1), (5): Das Paket ist fuer Mac und Windows
  # byte-gleich. Beide Laeufer bauen es aus demselben Stand mit derselben
  # Generation und demselben Zeitstempel; das Manifest (Pfade, Groessen,
  # SHA-256 jeder Datei) muss mit dem des Bau-Laeufers uebereinstimmen.
  plattformen:
    name: Paketbau auf ${{ matrix.os }} (P-3.03)
    needs: bauen
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Oberflaeche bauen (ui/)
        working-directory: client
        run: |
          npm ci
          npm run build
          rm -rf "$GITHUB_WORKSPACE/bundle/ui"
          cp -R dist "$GITHUB_WORKSPACE/bundle/ui"
      - name: Paket bauen
        working-directory: client/src-tauri
        run: |
          OA=()
          if [ -s "$GITHUB_WORKSPACE/scripts/ourairports/stand.txt" ]; then
            OA=(--ourairports-commit "$(head -1 "$GITHUB_WORKSPACE/scripts/ourairports/stand.txt")")
          fi
          cargo run -q -p runtime-bundle --bin paket-bauen -- \
            "$GITHUB_WORKSPACE/bundle" "$GITHUB_WORKSPACE/paket" \
            --generation "${{ needs.bauen.outputs.generation }}" \
            --erstellt "${{ needs.bauen.outputs.erstellt }}" \
            --repo-commit "${{ github.sha }}" ${OA[@]+"${OA[@]}"} \
            --requires "$REQUIRES"
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ runner.os }}
          path: paket/manifest.json
          retention-days: 7

  plattform-vergleich:
    name: Paket Mac = Windows = Linux (P-3.03)
    needs: [bauen, plattformen]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laufzeit-paket-g${{ needs.bauen.outputs.generation }}
          path: linux
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
      - name: Manifeste vergleichen
        run: |
          for os in Windows macOS; do
            if cmp -s linux/manifest.json "manifest-$os/manifest.json"; then
              echo "$os: Paket byte-gleich (Manifest-SHA-256 $(sha256sum linux/manifest.json | cut -c1-16))" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "$os: Paket WEICHT AB" | tee -a "$GITHUB_STEP_SUMMARY"
              diff <(python3 -c 'import json,sys;[print(f["path"],f["sha256"]) for f in json.load(open(sys.argv[1]))["files"]]' linux/manifest.json) \
                   <(python3 -c 'import json,sys;[print(f["path"],f["sha256"]) for f in json.load(open(sys.argv[1]))["files"]]' "manifest-$os/manifest.json") | head -40
              exit 1
            fi
          done

  # P-2.30: jedes neue Paket gegen die letzten zwei veroeffentlichten
  # Client-Fassungen (Tags v3.*). Erwartet wird je Fassung „uebernommen"
  # oder „sauber uebergangen" (fehlende Faehigkeit/Fassung ausserhalb des
  # Bereichs, der Client behaelt seinen Stand); rot nur, wenn ein Client das
  # Paket gar nicht lesen koennte. Fassung und Faehigkeiten kommen aus dem
  # Stand des Tags (tauri.conf.json, FAEHIGKEITEN in laufzeit_paket.rs).
  client-tags:
    name: Letzte zwei Client-Fassungen
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.tags.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tags
        run: |
          LISTE=$(git tag -l 'v3.*' --sort=-v:refname | head -2 | python3 -c 'import json,sys;print(json.dumps([l.strip() for l in sys.stdin if l.strip()] or ["keiner"]))')
          echo "liste=$LISTE" >> "$GITHUB_OUTPUT"
          echo "Client-Fassungen: $LISTE"

  alte-clients:
    name: Neues Paket gegen Client ${{ matrix.tag }} (P-2.30)
    needs: [bauen, client-tags]
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.client-tags.outputs.liste) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Noch kein veroeffentlichter 3.x-Client
        if: matrix.tag == 'keiner'
        run: echo "Noch kein Tag v3.* — nichts zu pruefen (P-2.30 greift ab dem ersten 3.0-Release)." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.tag != 'keiner'
      - uses: Swatinem/rust-cache@v2
        if: matrix.tag != 'keiner'
        with:
          workspaces: client/src-tauri
      - uses: actions/download-artifact@v4
        if: matrix.tag != 'keiner'
        with:
          name: laufzeit-paket-g${{ needs.bauen.outputs.generation }}
          path: paket
      - name: Paket mit Fassung und Faehigkeiten von ${{ matrix.tag }} pruefen
        if: matrix.tag != 'keiner'
        working-directory: client/src-tauri
        env:
          TAG: ${{ matrix.tag }}
        run: |
          V=$(git show "$TAG:client/src-tauri/tauri.conf.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])')
          F=$(git show "$TAG:client/src-tauri/src/laufzeit_paket.rs" | python3 -c 'import re,sys;t=sys.stdin.read();m=re.search(r"const FAEHIGKEITEN: &\[&str\] = &\[(.*?)\];",t,re.S);print(",".join(re.findall(r"\"([^\"]+)\"",m.group(1))))')
          # Der Code DES ALTEN CLIENTS liest das Paket (Manifest-Parser und
          # Pruefregel aus dem Tag), nicht der heutige (Codex 30.10.).
          git worktree add -q "$RUNNER_TEMP/alt" "$TAG"
          cd "$RUNNER_TEMP/alt/client/src-tauri"
          if [ ! -f crates/runtime-bundle/src/bin/paket-pruefen.rs ]; then
            echo "::error::$TAG hat kein paket-pruefen (aelter als die Matrix)"; exit 1
          fi
          cargo run -q -p runtime-bundle --bin paket-pruefen -- "$GITHUB_WORKSPACE/paket/manifest.json" \
            --client-version "$V" --faehigkeiten "$F" | tee -a "$GITHUB_STEP_SUMMARY"

  vorab:
    name: Als Vorabstand auf live ablegen (nur Vorab-Piloten, P-3.13)
    needs: bauen
    if: needs.bauen.outputs.signiert == 'ja' && github.ref == 'refs/heads/v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laufzeit-paket-g${{ needs.bauen.outputs.generation }}
          path: paket
      - name: Hochladen und als Vorabstand ablegen
        env:
          SSH_KEY: ${{ secrets.LIVE_BUNDLE_VORAB_SSH_KEY }}
          G: ${{ needs.bauen.outputs.generation }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "Kein LIVE_BUNDLE_VORAB_SSH_KEY"; exit 1; fi
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/id"
          SSH="ssh -i $RUNNER_TEMP/id -p 2222 -o StrictHostKeyChecking=accept-new"
          ZIEL=bundle@live.kant.ovh
          # Erst Dateien, dann Manifest in einen Zwischenordner, dann unter
          # flock ablegen (scripts/bundle/veroeffentlichen.sh). --checksum
          # ersetzt auch eine frueher halb hochgeladene Datei gleichen Namens.
          rsync -a --checksum -e "$SSH" paket/blobs/ "$ZIEL:blobs/"
          rsync -a -e "$SSH" paket/manifest.json paket/manifest.json.minisig "$ZIEL:tmp-gen-$G/"
          # Der Vorab-Schluessel ist auf live per erzwungenem Befehl auf
          # Hochladen + "vorab" beschraenkt (scripts/bundle/ssh-befehl.sh).
          $SSH "$ZIEL" veroeffentlichen vorab "$G"
          rm -f "$RUNNER_TEMP/id"

  freigeben:
    name: Für alle freigeben (Freigabe Thomas bzw. P-9.43)
    # P-3.03/P-2.30: Freigegeben wird nur ein Paket, das auf Mac und Windows
    # gleich gebaut wird und die letzten Client-Fassungen nicht bricht.
    needs: [bauen, vorab, plattform-vergleich, alte-clients]
    runs-on: ubuntu-latest
    environment: ${{ needs.bauen.outputs.umgebung }}
    steps:
      - name: Zeiger umschalten
        env:
          # Nur als Secret DIESES Environments hinterlegt, auf live auf
          # "freigeben" beschraenkt — ohne Freigabe nicht erreichbar.
          SSH_KEY: ${{ secrets.LIVE_BUNDLE_FREIGABE_SSH_KEY }}
          G: ${{ needs.bauen.outputs.generation }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/id"
          ssh -i "$RUNNER_TEMP/id" -p 2222 -o StrictHostKeyChecking=accept-new bundle@live.kant.ovh veroeffentlichen freigeben "$G"
          rm -f "$RUNNER_TEMP/id"
