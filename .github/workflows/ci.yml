name: CI

# Build- + Test-Verifikation VOR dem Release. Ergaenzt release.yml, die
# nur auf Version-Tags laeuft: hier bekommt JEDER Push / PR eine echte
# Kompilier- und Testrunde — inklusive des Windows-only MSFS-Adapters
# (sim-msfs / telemetry.rs mit dem Byte-Level-Lockstep-Test), der auf der
# Linux-Werkbank nicht kompiliert. Kein Signieren, kein Release-Upload —
# reine Verifikation. Modelliert nach dem Preflight-Gate + Build-Setup in
# release.yml und dem Muster aus xplane-plugin-ci.yml.
#
# Hintergrund: Die MSFS-Adapter-Crate ist `#[cfg(target_os = "windows")]`
# — Premium-Profile (FMA/Engine/Config-Mapping + Lockstep) lassen sich nur
# auf einem Windows-Runner bauen/testen. Ohne diese CI muesste man dafuer
# einen Release-Tag ausspielen (= ungetesteter Code an Piloten) oder lokal
# einen Mac nutzen. Diese Datei macht „per Push verifizieren" moeglich.

on:
  push:
    branches: ['**']
    paths:
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Windows: der einzige Runner, der den MSFS-Adapter kompiliert ────
  # sim-msfs (telemetry.rs, Lockstep, from_block-Byte-Tests) ist
  # windows-only. `cargo test --workspace` baut hier den kompletten
  # Rust-Baum inkl. sim-msfs (bindgen aus crates.io, SimConnect-SDK
  # vendored in crates/sim-msfs/ffi/) und faehrt ALLE Tests — das ist die
  # Verifikation fuer Premium-Profil-Arbeit.
  rust-windows:
    name: Rust (Windows — MSFS-Adapter + Lockstep)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: cargo test (workspace, inkl. sim-msfs)
        working-directory: client/src-tauri
        run: cargo test --workspace
      - name: cargo clippy (informativ — Baseline erst pruefen, dann ggf. -D warnings)
        working-directory: client/src-tauri
        run: cargo clippy --workspace --all-targets

  # ─── Ubuntu: schneller Cross-Check (sim-core / sim-xplane) + Frontend ─
  # Spiegelt das release.yml-Preflight (cargo check --all-targets nach
  # apt-Deps). Faengt „lokal gruen, remote rot" durch ungestagete Files.
  rust-linux:
    name: Rust (Linux — Workspace-Check) + Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Ohne Recommends (= frueheres --no-install-recommends in ci.yml). Muss in
      # ci.yml und release.yml gleich sein: gleiche Paketliste + gleiche
      # `version` = gleicher Cache-Key, und der Release-Tag liest den Cache,
      # den ci.yml auf main gespeichert hat.
      - name: apt ohne Recommends
        run: echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99-no-recommends

      # Pakete aus dem Actions-Cache statt vom Ubuntu-Mirror: azure.archive.
      # ubuntu.com lieferte in Lauf 39844274945 (v2.1.8) nur 29.8 kB/s, der
      # apt-Download dauerte 26½ min statt 26 s. Ein Retry traefe denselben
      # Mirror, deshalb raus aus dem kritischen Pfad. Nur ein Cache-Miss (neue
      # Paketversion / neues Ubuntu) laedt noch vom Mirror; timeout-minutes
      # ist die Notbremse dafuer.
      - name: Install Linux build deps (Tauri/GTK — glib etc.)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        timeout-minutes: 12
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: tauri-deps-1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: cargo test (sim-core + sim-xplane — laufen auf Linux)
        working-directory: client/src-tauri
        run: cargo test -p sim-core -p sim-xplane
      - name: cargo check (ganzer Workspace)
        working-directory: client/src-tauri
        run: cargo check --all-targets
      - name: Frontend deps
        working-directory: client
        run: npm ci
      - name: Frontend typecheck + Tests
        working-directory: client
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx vitest run
      # Die Waechter, die ausserhalb von Vitest leben. Ohne diesen
      # Schritt liefen sie NIRGENDS: Vitest kennt sie nicht, und
      # Aenderungen unter scripts/ loesten den Workflow bisher nicht
      # einmal aus (externe Abnahme, 21.09.2026). Ein Waechter, den
      # niemand aufruft, ist kein Waechter.
      #
      # Jeder laeuft zuerst gegen sich selbst: `--selbsttest` stellt
      # den Fehler nach, den er finden soll. Meldet der Selbsttest
      # gruen, obwohl das Werkzeug kaputt ist, faellt es hier auf.
      # scripts/anzeige-sync.mjs laeuft hier bewusst NICHT: Es
      # vergleicht gegen das Nachbar-Repo aeroacars-live, das in der CI
      # nicht ausgecheckt ist. Es bleibt ein lokaler Waechter.
      - name: Waechter (Schriftzeichen der Cockpit-Schrift)
        run: |
          node scripts/pruefe-literale.mjs
          node scripts/pruefe-schriftzeichen.mjs --selbsttest
          node scripts/pruefe-schriftzeichen.mjs
