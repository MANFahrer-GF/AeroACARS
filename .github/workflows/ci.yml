name: CI

# Build- + Test-Verifikation VOR dem Release. Ergaenzt release.yml, die
# nur auf Version-Tags laeuft: hier bekommt JEDER Push / PR eine echte
# Kompilier- und Testrunde — inklusive des Windows-only MSFS-Adapters
# (sim-msfs / telemetry.rs mit dem Byte-Level-Lockstep-Test), der auf der
# Linux-Werkbank nicht kompiliert. Kein Signieren, kein Release-Upload —
# reine Verifikation. Modelliert nach dem Preflight-Gate + Build-Setup in
# release.yml und dem Muster aus xplane-plugin-ci.yml.
#
# Hintergrund: Die MSFS-Adapter-Crate ist `#[cfg(target_os = "windows")]`
# — Premium-Profile (FMA/Engine/Config-Mapping + Lockstep) lassen sich nur
# auf einem Windows-Runner bauen/testen. Ohne diese CI muesste man dafuer
# einen Release-Tag ausspielen (= ungetesteter Code an Piloten) oder lokal
# einen Mac nutzen. Diese Datei macht „per Push verifizieren" moeglich.

on:
  push:
    branches: ['**']
    paths:
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Windows: der einzige Runner, der den MSFS-Adapter kompiliert ────
  # sim-msfs (telemetry.rs, Lockstep, from_block-Byte-Tests) ist
  # windows-only. `cargo test --workspace` baut hier den kompletten
  # Rust-Baum inkl. sim-msfs (bindgen aus crates.io, SimConnect-SDK
  # vendored in crates/sim-msfs/ffi/) und faehrt ALLE Tests — das ist die
  # Verifikation fuer Premium-Profil-Arbeit.
  rust-windows:
    name: Rust (Windows — MSFS-Adapter + Lockstep)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: cargo test (workspace, inkl. sim-msfs)
        working-directory: client/src-tauri
        run: cargo test --workspace
      # P-4.32: Rechenzeit je Bewertungsaufruf auf dem Windows-Laeufer
      # (Median/p99/Max ueber den Selbsttest-Korpus, Grenze 1 s je Aufruf).
      - name: Rechenzeit Bewertungsmodul (P-4.32)
        working-directory: client/src-tauri
        shell: bash
        run: cargo test --release -p bewertung-host --test selbsttest_korpus -- --ignored --nocapture rechenzeit_je_aufruf | tee -a "$GITHUB_STEP_SUMMARY"
      # P-12.03 (6): native Verdichtung aus dem Replay-Korpus, Vergleich mit
      # macOS im Job `mac-gleich-windows`.
      - name: Replay-Korpus ausgeben (P-12.03)
        working-directory: client/src-tauri
        shell: bash
        run: REPLAY_AUSGABE="$RUNNER_TEMP/replay.txt" cargo test -p aeroacars-app --test touchdown_v2_replay replay_korpus_ausgabe_fuer_den_plattformvergleich
      - uses: actions/upload-artifact@v7
        with:
          name: replay-Windows
          path: ${{ runner.temp }}/replay.txt
          retention-days: 7
      - name: cargo clippy (informativ — Baseline erst pruefen, dann ggf. -D warnings)
        working-directory: client/src-tauri
        run: cargo clippy --workspace --all-targets

  # ─── macOS: alle Rust-Tests (P-13.20, P-12.03 (2)/(3)) ───────────────
  # Derselbe Workspace-Lauf wie auf Windows (ohne den Windows-only
  # MSFS-Adapter): Selbsttest-Korpus des Bewertungsmoduls auf wasmi/Mac,
  # Laden, Rueckfall und Flug-Pin. Dazu die Replay-Ausgabe fuer den
  # Vergleich mit Windows.
  rust-macos:
    name: Rust (macOS — Workspace + Replay)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: cargo test (workspace)
        working-directory: client/src-tauri
        run: cargo test --workspace
      - name: Replay-Korpus ausgeben (P-12.03)
        working-directory: client/src-tauri
        run: REPLAY_AUSGABE="$RUNNER_TEMP/replay.txt" cargo test -p aeroacars-app --test touchdown_v2_replay replay_korpus_ausgabe_fuer_den_plattformvergleich
      - uses: actions/upload-artifact@v7
        with:
          name: replay-macOS
          path: ${{ runner.temp }}/replay.txt
          retention-days: 7

  # P-12.03 (6): Mac und Windows verdichten das Replay-Korpus gleich.
  mac-gleich-windows:
    name: Replay Mac = Windows (P-12.03)
    needs: [rust-windows, rust-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
      - name: Vergleichen
        run: |
          if cmp -s replay-Windows/replay.txt replay-macOS/replay.txt; then
            echo "Replay-Korpus: Mac = Windows ($(wc -l < replay-macOS/replay.txt) Fixtures, SHA-256 $(sha256sum replay-macOS/replay.txt | cut -c1-16))" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Replay-Korpus: Mac und Windows WEICHEN AB" | tee -a "$GITHUB_STEP_SUMMARY"
            diff replay-Windows/replay.txt replay-macOS/replay.txt | head -40
            exit 1
          fi

  # ─── Etappe 5 (P-8.03, P-13.20): Oberflaeche ueber aeroui:// ──────────
  # Baut die App (debug, Frontend eingebettet wie im Release) und startet
  # sie zweimal im Selbsttest-Modus (client/src-tauri/src/ui_lader.rs): nur
  # das Fenster `ui`, Testseite ueber den Paket-Weg des Laders. Gemessen
  # werden CSP, fetch an live, Schrift/WASM, Fehlerseite, Rechte (jeder
  # Systembefehl abgewiesen) und der Ursprung ueber zwei Starts — auf
  # WebView2 (Windows) und WKWebView (macOS). Messprotokoll in der
  # Zusammenfassung des Laufs und als Artefakt.
  ui-selbsttest:
    name: UI-Selbsttest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
          key: ui-selbsttest
      - name: Auswerter gegen sich selbst
        run: node scripts/ui-selbsttest-auswerten.mjs --selbsttest
      - name: Frontend deps
        working-directory: client
        run: npm ci
      - name: App bauen (debug, eingebettetes Frontend)
        working-directory: client
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then B="--bundles app"; else B="--no-bundle"; fi
          npx tauri build --debug $B --config src-tauri/tauri.lokal.conf.json
      - name: Zwei Selbsttest-Laeufe und Messprotokoll
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            APP=$(ls client/src-tauri/target/debug/bundle/macos/*.app/Contents/MacOS/* | head -1)
          else
            APP=client/src-tauri/target/debug/aeroacars-app.exe
          fi
          for n in 1 2; do
            AEROACARS_UI_SELBSTTEST="$RUNNER_TEMP/lauf$n.json" "$APP" || echo "Lauf $n endete mit $?"
            cat "$RUNNER_TEMP/lauf$n.json" || true
          done
          node scripts/ui-selbsttest-auswerten.mjs "$RUNNER_TEMP/lauf1.json" "$RUNNER_TEMP/lauf2.json" "$RUNNER_OS" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-selbsttest-${{ runner.os }}
          path: ${{ runner.temp }}/lauf*.json

  # ─── Ubuntu: schneller Cross-Check (sim-core / sim-xplane) + Frontend ─
  # Spiegelt das release.yml-Preflight (cargo check --all-targets nach
  # apt-Deps). Faengt „lokal gruen, remote rot" durch ungestagete Files.
  rust-linux:
    name: Rust (Linux — Workspace-Check) + Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Ohne Recommends (= frueheres --no-install-recommends in ci.yml). Muss in
      # ci.yml und release.yml gleich sein: gleiche Paketliste + gleiche
      # `version` = gleicher Cache-Key, und der Release-Tag liest den Cache,
      # den ci.yml auf main gespeichert hat. `apt-get update` (7 s, nicht der
      # langsame Teil) macht die Action selbst nicht: ohne frische Listen
      # liefe ein Cache-Miss auf veraltete Versionen und 404.
      - name: apt vorbereiten (Listen aktualisieren, ohne Recommends)
        timeout-minutes: 3
        run: |
          echo 'APT::Install-Recommends "false";' | sudo tee /etc/apt/apt.conf.d/99-no-recommends
          sudo apt-get update

      # Pakete aus dem Actions-Cache statt vom Ubuntu-Mirror: azure.archive.
      # ubuntu.com lieferte in Lauf 39844274945 (v2.1.8) nur 29.8 kB/s, der
      # apt-Download dauerte 26½ min statt 26 s. Ein Retry traefe denselben
      # Mirror, deshalb raus aus dem kritischen Pfad. Nur ein Cache-Miss (neue
      # Paketversion / neues Ubuntu) laedt noch vom Mirror; timeout-minutes
      # ist die Notbremse dafuer.
      - name: Install Linux build deps (Tauri/GTK — glib etc.)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        timeout-minutes: 12
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: tauri-deps-1
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: cargo test (sim-core + sim-xplane — laufen auf Linux)
        working-directory: client/src-tauri
        run: cargo test -p sim-core -p sim-xplane
      - name: cargo check (ganzer Workspace)
        working-directory: client/src-tauri
        run: cargo check --all-targets
      # v3 Etappe 3 (P-4.01): Das eingecheckte Bewertungsmodul
      # bundle/module/bewertung.wasm muss wie dieser Quellstand rechnen
      # (frisch bauen, alle Faelle gegen Ablage und Crate vergleichen).
      - name: Bewertungsmodul gleich dem Quellstand
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
          sh scripts/bundle/modul-bauen.sh bewertung --pruefen
      # v3 Etappe 4 (P-3.58): ebenso das Kabinenmodul bundle/module/kabine.wasm
      # (sechs echte Fluege, Takt fuer Takt gegen Ablage und Planer nativ).
      - name: Kabinenmodul gleich dem Quellstand
        run: sh scripts/bundle/modul-bauen.sh kabine --pruefen
      - name: Frontend deps
        working-directory: client
        run: npm ci
      - name: Frontend typecheck + Tests
        working-directory: client
        run: |
          npx tsc -p tsconfig.json --noEmit
          npx vitest run
      # Die Waechter, die ausserhalb von Vitest leben. Ohne diesen
      # Schritt liefen sie NIRGENDS: Vitest kennt sie nicht, und
      # Aenderungen unter scripts/ loesten den Workflow bisher nicht
      # einmal aus (externe Abnahme, 21.09.2026). Ein Waechter, den
      # niemand aufruft, ist kein Waechter.
      #
      # Jeder laeuft zuerst gegen sich selbst: `--selbsttest` stellt
      # den Fehler nach, den er finden soll. Meldet der Selbsttest
      # gruen, obwohl das Werkzeug kaputt ist, faellt es hier auf.
      # scripts/anzeige-sync.mjs laeuft hier bewusst NICHT: Es
      # vergleicht gegen das Nachbar-Repo aeroacars-live, das in der CI
      # nicht ausgecheckt ist. Es bleibt ein lokaler Waechter.
      - name: Waechter (Schriftzeichen der Cockpit-Schrift)
        run: |
          node scripts/pruefe-literale.mjs
          node scripts/pruefe-schriftzeichen.mjs --selbsttest
          node scripts/pruefe-schriftzeichen.mjs
