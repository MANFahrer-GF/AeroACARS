name: Dev Build (unsigned, manual)

# Manueller, UNSIGNIERTER Build (Windows + macOS Apple Silicon) zum lokalen
# Testen — kein Tag, kein GitHub-Release, kein Auto-Updater-Eintrag
# (createUpdaterArtifacts wird nur fuer diesen Lauf per --config auf false
# gesetzt, tauri.conf.json bleibt unberuehrt). v3 (P-11.21): dieselbe
# Beikonfiguration tauri.lokal.conf.json gibt dem Dev-Build die eigene Kennung
# (Eingang beta=true: tauri.beta.conf.json, Produktionskennung com.aeroacars.app3
# fuer Beta-Installer an Vorab-Piloten, siehe Beta-Update-Kanal unten)
# com.aeroacars.app3.dev und den Namen "AeroACARS 3 Dev" — eigener Datenordner,
# ein Probestart beruehrt nie Sitzung oder Flug der Beta. Fuer schnelle Iterationen
# (z. B. Aircraft-Scan-Fixes), die Thomas auf seiner echten Maschine mit
# echtem MSFS/X-Plane pruefen soll, BEVOR ein offizieller signierter
# Release-Tag geschnitten wird (siehe release.yml — der bleibt der einzige
# Weg zu einem echten, an Piloten ausgelieferten Release). Artefakte liegen
# 7 Tage im Actions-Run zum Download bereit und verschwinden danach
# automatisch — bewusst kein Distributionskanal.
#
# macOS-Hinweis: das .app/.dmg ist UNSIGNIERT — Gatekeeper blockiert den
# ersten Start ("nicht identifizierter Entwickler" / "beschaedigt"). Vor dem
# ersten Oeffnen im Terminal: `xattr -cr /Pfad/zu/AeroACARS.app` (entfernt
# das Quarantaene-Flag), dann normal per Doppelklick oeffnen.
#
# Beta-Update-Kanal (beta=true): tauri.beta.conf.json schaltet die
# Updater-Dateien ein und setzt den eigenen Endpunkt
# releases/download/aeroacars3-beta-kanal/latest.json (getrennt vom
# 2.x-Kanal releases/latest). Die Builds signieren sie mit dem Updater-Schluessel
# wie release.yml, der Mac-Build ist Pflicht-signiert (Apple). Der Job
# beta-kanal legt Installer, Update-Dateien und latest.json als Artefakt
# AeroACARS-beta-kanal ab — VEROEFFENTLICHT NICHTS. Das macht nach Freigabe
# scripts/beta-veroeffentlichen.sh <run-id>.
# Wie im Release baut ein Beta-Lauf zuerst das X-Plane-Plugin-Paket; die App
# traegt dessen SHA-256 fest eingebaut (ADR-0004 §8) und installiert nur genau
# dieses Paket. Ohne Pruefsumme kein Beta-Build.
on:
  workflow_dispatch:
    inputs:
      apple_signieren:
        description: 'macOS mit Apple Developer ID signieren + notarisieren (Secrets noetig)'
        type: boolean
        default: false
      beta:
        description: 'Beta-Installer: Produktionskennung com.aeroacars.app3 (tauri.beta.conf.json), signierte Updater-Dateien + latest.json fuer den Beta-Kanal als Artefakt; ohne Tag und Release'
        type: boolean
        default: false

jobs:
  # ---- Nur beta: X-Plane-Plugin bauen (wie release.yml plugin-build) ----
  plugin-build:
    if: inputs.beta
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-2022 wie in release.yml (windows-latest ohne VS-Instanz).
          - platform: windows-2022
            generator: 'Visual Studio 17 2022'
            cmake_args: '-A x64'
            xpl_name: 'win.xpl'
            os_label: 'Windows x64'
          - platform: macos-latest
            generator: 'Unix Makefiles'
            cmake_args: '-DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64"'
            xpl_name: 'mac.xpl'
            os_label: 'macOS universal'
          - platform: ubuntu-latest
            generator: 'Unix Makefiles'
            cmake_args: '-DCMAKE_BUILD_TYPE=Release'
            xpl_name: 'lin.xpl'
            os_label: 'Linux x64'
    runs-on: ${{ matrix.platform }}
    name: Plugin — ${{ matrix.os_label }}
    steps:
      - uses: actions/checkout@v7

      - name: OpenGL-Header (Linux, fuer das HUD-Band)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl-dev

      - name: Configure CMake
        working-directory: xplane-plugin
        shell: bash
        run: |
          cmake -B build -G "${{ matrix.generator }}" ${{ matrix.cmake_args }}

      - name: Build plugin (Release)
        working-directory: xplane-plugin
        shell: bash
        run: |
          cmake --build build --config Release --target AeroACARS

      - name: Sign mac.xpl
        if: matrix.xpl_name == 'mac.xpl'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_SECRET: ${{ secrets.APPLE_API_KEY_P8 }}
          AEROACARS_SIGNATUR_PFLICHT: "1"
        run: .github/scripts/apple-plugin-signieren.sh xplane-plugin/build/AeroACARS/64/mac.xpl

      - name: Upload .xpl artifact
        uses: actions/upload-artifact@v7
        with:
          name: xplane-plugin-${{ matrix.xpl_name }}-${{ github.sha }}
          path: xplane-plugin/build/AeroACARS/64/${{ matrix.xpl_name }}
          if-no-files-found: error
          retention-days: 7

  # ---- Nur beta: Plugin-Paket + Pruefsumme (VOR der App, wie release.yml) ----
  # Name wie in der App erwartet (xplane_plugin_install.rs:
  # releases/download/v{VERSION}/AeroACARS-XPlane-Plugin-v{VERSION}.zip).
  plugin-zip:
    if: inputs.beta
    needs: plugin-build
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.summe.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: .xpl laden
        uses: actions/download-artifact@v8
        with:
          pattern: xplane-plugin-*.xpl-${{ github.sha }}
          path: pkg/AeroACARS/64
          merge-multiple: true

      - name: Stage attribution + readme
        run: |
          set -euo pipefail
          for x in win.xpl mac.xpl lin.xpl; do test -s "pkg/AeroACARS/64/$x"; done
          cp xplane-plugin/README.md pkg/AeroACARS/README.md
          cp xplane-plugin/third_party/XPSDK430/license.txt pkg/AeroACARS/XPLM_SDK_LICENSE.txt
          cp xplane-plugin/third_party/opensans/OFL.txt pkg/AeroACARS/OpenSans_OFL.txt
          cp xplane-plugin/third_party/stb/LICENSE pkg/AeroACARS/stb_LICENSE.txt
          find pkg -type f -printf '%p (%s bytes)\n'

      - name: Zip + SHA-256
        id: summe
        run: |
          set -euo pipefail
          VER=$(jq -r .version client/src-tauri/tauri.conf.json)
          ZIP="AeroACARS-XPlane-Plugin-v${VER}.zip"
          (cd pkg && zip -r "../$ZIP" AeroACARS)
          SUMME=$(sha256sum "$ZIP" | cut -d' ' -f1)
          echo "sha256=$SUMME" >> "$GITHUB_OUTPUT"
          echo "Plugin-Paket $ZIP SHA-256: $SUMME"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: AeroACARS-xplane-plugin-zip-${{ github.sha }}
          path: AeroACARS-XPlane-Plugin-v*.zip
          if-no-files-found: error
          retention-days: 7

  dev-build-windows:
    # Bei beta erst das Plugin-Paket (Pruefsumme), ohne beta wird es
    # uebersprungen und der Dev-Build laeuft wie bisher sofort los.
    needs: plugin-zip
    if: ${{ !cancelled() && (needs.plugin-zip.result == 'success' || (!inputs.beta && needs.plugin-zip.result == 'skipped')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      # Wie release.yml: Ohne Pruefsumme installierte die App das X-Plane-
      # Plugin ungeprueft. Eine Beta geht an Piloten — hier sperren.
      - name: Require X-Plane plugin SHA-256 (beta)
        if: inputs.beta
        shell: bash
        env:
          SUMME: ${{ needs.plugin-zip.outputs.sha256 }}
        run: |
          if [[ ! "$SUMME" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Keine gueltige SHA-256 des X-Plane-Plugin-Pakets ('$SUMME')"
            exit 1
          fi

      - name: Build (Updater-Dateien nur bei beta)
        shell: bash
        working-directory: client
        env:
          # Nur Beta: Updater-Dateien mit demselben Schluessel wie release.yml
          # signieren. Ohne beta schaltet tauri.lokal.conf.json sie ab.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.beta && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.beta && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Beta an Piloten: Fehlerberichte wie im Release (release.yml).
          AEROACARS_SENTRY_DSN: ${{ inputs.beta && secrets.AEROACARS_SENTRY_DSN || '' }}
          VITE_SENTRY_DSN_CLIENT: ${{ inputs.beta && secrets.VITE_SENTRY_DSN_CLIENT || '' }}
          # Pruefsumme des Plugin-Pakets (leer ohne beta = Dev-Build, Warnung).
          AEROACARS_XPLANE_PLUGIN_SHA256: ${{ needs.plugin-zip.outputs.sha256 }}
        run: npx tauri build --bundles nsis --config src-tauri/${{ inputs.beta && 'tauri.beta.conf.json' || 'tauri.lokal.conf.json' }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: AeroACARS-dev-build-windows-${{ github.sha }}
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7

      - name: Upload Update-Signatur (beta)
        if: inputs.beta
        uses: actions/upload-artifact@v7
        with:
          name: AeroACARS-beta-updater-windows-${{ github.sha }}
          path: client/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  dev-build-macos:
    # Bei beta erst das Plugin-Paket (Pruefsumme), ohne beta wird es
    # uebersprungen und der Dev-Build laeuft wie bisher sofort los.
    needs: plugin-zip
    if: ${{ !cancelled() && (needs.plugin-zip.result == 'success' || (!inputs.beta && needs.plugin-zip.result == 'skipped')) }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Install frontend deps
        working-directory: client
        run: npm ci

      # Nur auf Wunsch (Schalter beim Starten des Laufs): gleiche Signatur wie
      # im Release, um sie ohne Tag zu pruefen. Bei beta Pflicht: das
      # Auto-Update ersetzt die App der Piloten, unsigniert blockiert Gatekeeper.
      - name: Apple-Signatur vorbereiten
        if: inputs.apple_signieren || inputs.beta
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_SECRET: ${{ secrets.APPLE_API_KEY_P8 }}
          AEROACARS_SIGNATUR_PFLICHT: ${{ inputs.beta && '1' || '0' }}
        run: .github/scripts/apple-signatur-vorbereiten.sh

      # Wie release.yml: Ohne Pruefsumme installierte die App das X-Plane-
      # Plugin ungeprueft. Eine Beta geht an Piloten — hier sperren.
      - name: Require X-Plane plugin SHA-256 (beta)
        if: inputs.beta
        shell: bash
        env:
          SUMME: ${{ needs.plugin-zip.outputs.sha256 }}
        run: |
          if [[ ! "$SUMME" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Keine gueltige SHA-256 des X-Plane-Plugin-Pakets ('$SUMME')"
            exit 1
          fi

      - name: Build (Updater-Dateien nur bei beta)
        shell: bash
        working-directory: client
        env:
          # Nur Beta: Updater-Dateien mit demselben Schluessel wie release.yml
          # signieren. Ohne beta schaltet tauri.lokal.conf.json sie ab.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.beta && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.beta && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # Beta an Piloten: Fehlerberichte wie im Release (release.yml).
          AEROACARS_SENTRY_DSN: ${{ inputs.beta && secrets.AEROACARS_SENTRY_DSN || '' }}
          VITE_SENTRY_DSN_CLIENT: ${{ inputs.beta && secrets.VITE_SENTRY_DSN_CLIENT || '' }}
          # Pruefsumme des Plugin-Pakets (leer ohne beta = Dev-Build, Warnung).
          AEROACARS_XPLANE_PLUGIN_SHA256: ${{ needs.plugin-zip.outputs.sha256 }}
        run: npx tauri build --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/${{ inputs.beta && 'tauri.beta.conf.json' || 'tauri.lokal.conf.json' }}

      - name: Apple-Signatur pruefen
        if: inputs.apple_signieren || inputs.beta
        shell: bash
        run: .github/scripts/apple-app-pruefen.sh client/src-tauri/target/aarch64-apple-darwin/release/bundle/macos

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: AeroACARS-dev-build-macos-${{ github.sha }}
          path: client/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7

      - name: Upload Update-Paket (beta)
        if: inputs.beta
        uses: actions/upload-artifact@v7
        with:
          name: AeroACARS-beta-updater-macos-${{ github.sha }}
          path: |
            client/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            client/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  # Nur beta: Paket fuer den Beta-Update-Kanal zusammenstellen (feste Namen,
  # latest.json mit Notes aus docs/release-notes/v<version>.md). Kein Upload
  # an ein Release — das macht scripts/beta-veroeffentlichen.sh nach Freigabe.
  beta-kanal:
    if: inputs.beta
    needs: [plugin-zip, dev-build-windows, dev-build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build-Dateien laden
        uses: actions/download-artifact@v8
        with:
          pattern: AeroACARS-*-${{ github.sha }}
          path: roh

      - name: latest.json bauen
        env:
          PLUGIN_SHA256: ${{ needs.plugin-zip.outputs.sha256 }}
        run: .github/scripts/beta-kanal-bauen.sh roh kanal "$PLUGIN_SHA256"

      - name: Upload Beta-Kanal-Paket
        uses: actions/upload-artifact@v7
        with:
          name: AeroACARS-beta-kanal
          path: kanal/*
          if-no-files-found: error
          retention-days: 7
