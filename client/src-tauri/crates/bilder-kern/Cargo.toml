[package]
name = "bilder-kern"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bilder-Tab (N-13, Faehigkeit bilder-1): verwalteter Ordner, Quellen, Beobachtung, Multipart, Windows-Teile. Kein tauri, kein reqwest."

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
chrono.workspace = true
uuid = { version = "1", features = ["v4"] }
png = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
] }
# Windows.Graphics.Capture (Fensteraufnahme auch bei verdecktem oder Vollbild-Simulator): nur die noetigen Teile.
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
