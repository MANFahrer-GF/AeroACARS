[package]
name = "bewertung-host"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "AeroACARS 3.0: WASM-Host fuer die Paketmodule Bewertung und Kabinenplaner (wasmi, Rechenzeit- und Speichergrenze, P-4.30, P-3.58)."

[dependencies]
wasmi = "2.0.0"

[dev-dependencies]
wat = "1"
landing-scoring.workspace = true
# float_roundtrip wie im Client-Crate: Ohne waere selftest.json je nach
# Bau (`-p bewertung-host` allein oder `--workspace`) anders erzeugt.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Gleichheitslauf: Paket-Kennung (sha256 des Manifests) und Laufzeit.
sha2 = "0.10"
chrono.workspace = true

[lints]
workspace = true
