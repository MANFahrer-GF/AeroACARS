<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-control" content="NO-CACHE">
  <title>AeroACARS</title>
  <link rel="stylesheet" href="/SCSS/common.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="panel-frame.css" />

  <!--
    v0.12.0 (03.10.2026) — Geruest nach dem Muster eines laufenden
    Fremd-Panels (SOQA Airport Moving Map, MSFS 2024). Nichts davon ist
    kopiert; es ist die Asobo-Standardbauweise, die wir bisher nicht
    hatten:

    1. <ingame-ui> steckt in einem EIGENEN Wurzel-Element
       (<ingamepanel-aeroacars>, erbt von TemplateElement, wird in
       panel-frame.js registriert, am Ende checkAutoload()).
    2. Alle Framework-Skripte + Button-Templates, die die Titelleiste
       braucht (ohne sie rendern deren Knoepfe mit 0x0).
    3. class="ingameUiFrame panelInvisible" BLEIBT stehen — wir
       entfernen nichts (v0.10.0 tat es nach Forum-Tipp, ohne Erfolg).
    4. Der Streifen sitzt in #aa2-host unterhalb der Titelleiste; der
       Rahmen schrumpft auf Titelleiste + Streifen (panel-frame.js),
       der Bildschirm darunter bleibt frei.
  -->
  <script type="text/javascript" src="/JS/coherent.js"></script>
  <script type="text/javascript" src="/JS/common.js"></script>
  <script type="text/javascript" src="/JS/dataStorage.js"></script>
  <script type="text/javascript" src="/JS/buttons.js"></script>
  <script type="text/javascript" src="/JS/simvar.js"></script>
  <script type="text/javascript" src="/JS/Inputs.js"></script>
  <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>

  <link rel="import" href="/templates/NewPushButton/NewPushButton.html" />
  <link rel="import" href="/templates/ToggleButton/toggleButton.html" />
  <link rel="import" href="/templates/tabMenu/tabMenu.html" />
  <link rel="import" href="/templates/NewListButton/NewListButton.html" />
  <link rel="import" href="/templates/ingameUi/ingameUi.html" />
  <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />

  <script type="text/javascript" src="panel-frame.js"></script>
</head>
<body class="aa2-nativ border-box">
  <ingamepanel-aeroacars>
    <ingame-ui
      id="AeroACARSPanel"
      panel-id="PANEL_AEROACARS_PANEL"
      title="AeroACARS"
      class="ingameUiFrame panelInvisible"
      content-fit="false"
      auto-inside=""
      data-input-group="INGAME-UI"
      min-width="20"
      min-height="8"
      resize="both"
    >
      <div id="aa2-host" class="aa2-host">
        <div class="aa2-strip"></div>
      </div>
    </ingame-ui>
  </ingamepanel-aeroacars>

  <script type="text/javascript" src="panel.js"></script>
</body>
</html>
