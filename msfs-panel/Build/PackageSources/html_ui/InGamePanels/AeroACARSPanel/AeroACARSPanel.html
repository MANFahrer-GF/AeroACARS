<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AeroACARS</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body class="aa2-nativ">
  <!--
    ═══════════════════════════════════════════════════════════════════
    v0.4.0 — KEIN <ingame-ui>. Das ist eine Korrektur, keine Nachlaessigkeit.
    ═══════════════════════════════════════════════════════════════════

    Thomas' Feldbefund (09.08.2026, nach dem Test von v0.3.0):

      "Das Fenster laesst sich nicht verschieben. Wir hatten eine Version,
       das war die letzte, die keine Kopfzeile oben hatte. Die hatte sich
       verschieben lassen."

    Die verschiebbare Fassung war Runde 1 (Commit 37266dd): schlichtes
    HTML, KEIN <ingame-ui>, keine Framework-Importe, keine eigene
    Kopfzeile. Erst mit <ingame-ui> kam die Kopfzeile — und das Ziehen
    war weg.

    Das passt zum bestaetigten Asobo-Bug (MSFS-DevSupport, mehrere
    Addon-Entwickler seit SU2): der Sim haengt <ingame-ui>-Elementen
    selbst die Klassen `hide` und `panelInvisible` an und bricht damit
    Titelleiste und Ziehen. Solange das offen ist, ist die eigene
    Fensterdekoration ein Minusgeschaeft: Ohne <ingame-ui> stellt der Sim
    seinen EIGENEN Fensterrahmen um die Seite — der funktioniert, und der
    Streifen bekommt die volle Flaeche statt sie mit einer Kopfzeile zu
    teilen.

    Der zweite Feldbefund haengt genau daran: "die Zeile ist zu klein,
    es wird nur eins angezeigt". v0.3.0 hatte 92 px Rahmenhoehe, davon
    frass die Kopfzeile rund 40 px — es blieben ~50 px fuer einen
    Streifen, der gemessen 63 px braucht. Also war immer nur EINE der
    beiden Zeilen zu sehen. Ohne Kopfzeile ist das Problem an der Wurzel
    weg.

    ⚠ NICHT "aufraeumen" und <ingame-ui> wieder einfuehren, ohne im Sim
      zu pruefen, ob der Asobo-Bug behoben ist. Die Rueckfall-Variante
      steht in ../../../../../README.md unter "Variante B".
  -->
  <!--
    Der Schalter fuer den nativen Teil in panel.css ist `aa2-nativ` am
    <body> — bewusst DORT und nicht am Streifen. Zwei Fehlversuche
    liegen dahinter, beide im Test gefunden (09.08.2026):

      1. `body > .aa2-strip` als CSS-Auswahl: brach, sobald der Sim den
         Streifen in ein eigenes Rahmen-Div legte (dann kein direktes
         Body-Kind mehr) — und dann gewann die Flow-Regel `position:
         absolute`.
      2. Die Klasse am Streifen selbst: panel.js setzt dessen
         `className` beim Umschalten auf "ruhig" komplett neu und
         loescht dabei jede Zusatzklasse. Der Marker war nach dem
         ersten Takt weg.

    Der Body wird von niemandem angefasst und ist immer Vorfahre.
  -->
  <div class="aa2-strip"></div>

  <script type="text/javascript" src="panel.js"></script>

  <!--
    NUR nativ: Titelleiste und Ziehen. Bewusst eine EIGENE Datei, damit
    panel.js byte-identisch mit dem Flow-Widget bleibt. Laedt NACH
    panel.js, weil sie den fertig aufgebauten Streifen als Ziehgriff
    braucht. Reihenfolge nicht tauschen.
  -->
  <script type="text/javascript" src="panel-chrome.js"></script>
</body>
</html>
