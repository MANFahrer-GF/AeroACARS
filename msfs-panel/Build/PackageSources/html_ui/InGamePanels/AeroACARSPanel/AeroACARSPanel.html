<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AeroACARS</title>
  <link rel="stylesheet" href="panel.css" />

  <!--
    PFLICHT — und im Feld verifiziert (Thomas, 09.08.2026, Runde-3-Stand:
    "das letzte native Panel konnten wir verschieben").

    Ohne diese vier Skripte und zwei Vorlagen-Importe ist <ingame-ui> ein
    unregistriertes Tag ohne jedes Verhalten: es rendert seine Kinder
    inline, sonst nichts — kein Rahmen, keine Titelleiste, kein Ziehen.
    Genau das war der Fehlschlag aus Runde 2, wo der Wrapper allein
    gesetzt war. Quelle: Dutch-FlightSim-Developer/
    developing-with-simconnect Teil 13-4 plus das dazu passende, noch
    offene Asobo-Ticket 18144.
  -->
  <script type="text/javascript" src="/JS/coherent.js"></script>
  <script type="text/javascript" src="/JS/common.js"></script>
  <script type="text/javascript" src="/JS/buttons.js"></script>
  <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>

  <link rel="import" href="/templates/ingameUi/ingameUi.html" />
  <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />
</head>
<body>
  <!--
    v0.3.0 (09.08.2026): Inhalt ist jetzt der HUD-Streifen aus dem
    Flow-Pro-Widget v3.3 — panel.js ist byte-identisch mit dessen code.js,
    panel.css ist dessen code.css plus einem nativen Rahmen-Block am Ende.
    EINE Quelle, zwei Ziele.

    Vorher standen hier fuenf handgepflegte Ansichten (monitor/approach/
    scoring/score/debrief) mit festen Kennungen. Die sind ersatzlos weg:
    der Streifen deckt dieselben Zustaende ab, aber in der Fassung, die
    18 QS-Faelle und einen Feldtag hinter sich hat — inklusive der teuer
    erkauften Coherent-GT-Regeln (kein `gap`, nur ASCII), die hier
    genauso gelten, weil BEIDE Umgebungen derselbe Renderer sind.

    Der Streifen baut sich komplett selbst auf, unter `aa2-`-Kennungen.
    Deshalb bleibt dieses Markup leer — das ist Absicht, nicht Rest.

    Kein `content-fit`: in dieser SDK-Fassung kaputt (Asobo-Ticket 18144),
    feste Rahmengroesse in panel.css ist der dokumentierte Ausweg.
    `resize="both"` erlaubt manuelles Anpassen.

    ⚠ Zum Schliessen das Toolbar-Symbol benutzen, NICHT das X der
    Titelleiste — die Knoepfe der nativen Leiste stehen im
    MSFS-Devsupport-Forum als Absturzausloeser.
  -->
  <ingame-ui
    id="AeroACARSPanel"
    panel-id="PANEL_AEROACARS_PANEL"
    title="AeroACARS"
    class="ingameUiFrame"
    resize="both"
    auto-inside=""
    data-input-group="INGAME-UI"
  >
    <div class="aa2-strip"></div>
  </ingame-ui>

  <script type="text/javascript" src="panel.js"></script>
</body>
</html>
